<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14222B">
<title>Circuit Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF3EF;--paper2:#DFE8E2;--ink:#14222B;--ink2:#1E3541;--ink3:#2D4A5A;--teal:#0E7C86;--teal2:#2BC4CF;--amber:#F4B41A;--rose:#D63A5A;--mist:#9DB3AC;--txt:#E8F1ED;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:760px;margin:0 auto;position:relative;background:var(--ink)}
#top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--st)) 12px 8px;min-height:52px}
#top .brand{font-weight:800;font-size:19px;letter-spacing:-.02em;flex:1}
#top .brand small{font-weight:400;opacity:.65;font-size:12px;margin-left:6px;letter-spacing:0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ink2)}
.iconbtn svg{width:22px;height:22px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#score{font-weight:600;font-size:14px;background:var(--ink2);padding:8px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
#score b{color:var(--amber)}
#goal{display:none;align-items:flex-start;gap:10px;background:var(--ink2);padding:9px 12px;font-size:14px;line-height:1.35}
#goal.on{display:flex}
#goal .t{flex:1}
#goal .t b{display:block;font-size:15px;margin-bottom:1px}
#goal button{background:var(--amber);color:var(--ink);font-weight:600;border-radius:10px;padding:7px 11px;font-size:13px;white-space:nowrap}
#stage{flex:1;position:relative;background:var(--paper);min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#rail{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:7px}
#rail button{width:42px;height:42px;border-radius:13px;background:rgba(20,34,43,.92);display:grid;place-items:center;box-shadow:0 2px 8px rgba(20,34,43,.25)}
#rail button svg{width:22px;height:22px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rail button.on{background:var(--teal)}
#rail button:disabled{opacity:.4}
#chip{position:absolute;left:8px;top:8px;background:rgba(20,34,43,.92);padding:8px 12px;border-radius:12px;font-size:13.5px;font-variant-numeric:tabular-nums;display:none;max-width:60%}
#chip.on{display:block}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--txt);padding:10px 14px;border-radius:12px;font-size:14px;max-width:80%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5;box-shadow:0 4px 14px rgba(20,34,43,.35)}
#toast.on{opacity:1}
#toast.warn{background:var(--rose)}
#toast.good{background:var(--teal)}
#insp{position:absolute;left:0;right:0;bottom:0;background:rgba(20,34,43,.97);padding:10px 14px 12px;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .18s;z-index:4;box-shadow:0 -6px 20px rgba(20,34,43,.3)}
#insp.show{transform:none}
#insp .irow{display:flex;align-items:center;gap:8px}
#insp .irow b{font-size:16px}
#insp .muted{opacity:.6;font-size:13px;flex:1}
#insp .x{width:32px;height:32px;border-radius:10px;background:var(--ink2);display:grid;place-items:center}
#insp .read{font-size:14px;font-variant-numeric:tabular-nums;margin:6px 0 4px;color:var(--teal2);min-height:20px}
#insp .ctl{display:flex;align-items:center;gap:10px;margin:6px 0}
#insp .ctl label{font-size:13px;opacity:.8;min-width:62px}
#insp .ctl .val{font-weight:600;min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
#insp input[type=range]{flex:1;accent-color:var(--teal2);height:28px}
#insp .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{padding:8px 13px;border-radius:11px;background:var(--ink2);font-size:13.5px;font-weight:600}
.pill.on{background:var(--teal)}
.pill.danger{background:#5a2433}
.pill.amber{background:var(--amber);color:var(--ink)}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--txt)}
#scope{height:140px;background:#0A151C;flex:none;display:flex;flex-direction:column}
#app.esc #scope{height:116px}
#scview{position:relative;flex:1;min-height:0}
#sc{position:absolute;inset:0;width:100%;height:100%}
#scbar{display:flex;gap:5px;padding:5px 6px 2px;overflow-x:auto;scrollbar-width:none;flex:none}
#scbar::-webkit-scrollbar{display:none}
#scbar button{background:rgba(45,74,90,.85);border-radius:8px;min-width:30px;height:27px;font-size:12px;padding:0 9px;font-weight:600;white-space:nowrap;flex:none;border:2px solid transparent}
#scbar .sp{flex:1}
#scbar .ch1{color:#4FE0E8}#scbar .ch2{color:#8BE28B}#scbar .chi{color:#F4B41A}
#scbar button.armed{border-color:currentColor;background:rgba(255,255,255,.12)}
#scinfo{position:absolute;left:8px;top:2px;font-size:12.5px;display:flex;gap:14px;font-variant-numeric:tabular-nums;pointer-events:none;line-height:1.15;font-weight:600}
#scinfo span{white-space:nowrap}
#scinfo i{display:block;font-style:normal;font-weight:400;font-size:10.5px;opacity:.7}
#sceneWrap{display:none;height:142px;flex:none;background:#0F2430;position:relative}
#app.esc #sceneWrap{display:block}
#scn{position:absolute;inset:0;width:100%;height:100%}
#palette{display:flex;gap:6px;overflow-x:auto;padding:7px 8px calc(8px + var(--sb));background:var(--ink);flex:none;scrollbar-width:none}
#palette::-webkit-scrollbar{display:none}
#palette button{flex:none;width:64px;height:62px;border-radius:12px;background:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;border:2px solid transparent}
#palette button.on{border-color:var(--teal2);background:var(--ink3)}
#palette canvas{width:50px;height:36px}
#shade{position:fixed;inset:0;background:rgba(10,21,28,.6);z-index:20;display:none}
#shade.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;z-index:21;padding:18px 18px calc(24px + var(--sb));transform:translateY(105%);transition:transform .22s;max-width:760px;margin:0 auto}
#sheet.on{transform:none}
#sheet h2{margin:0 0 4px;font-size:25px;letter-spacing:-.02em;font-weight:800}
#sheet h3{margin:20px 0 8px;font-size:16px;font-weight:800}
#sheet p{margin:6px 0 10px;line-height:1.45;font-size:15px}
#sheet .sub{opacity:.7;font-size:14px}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;font-weight:600;font-size:16px;text-align:left;margin:8px 0;background:var(--paper2);color:var(--ink)}
.btn.primary{background:var(--teal);color:#fff}
.btn.dark{background:var(--ink);color:var(--txt)}
.btn small{display:block;font-weight:400;opacity:.75;font-size:13px;margin-top:2px}
.btn.opt.ok{background:#bfe8cf}
.btn.opt.bad{background:#f2c3cc}
.btn.row{display:flex;align-items:center;gap:12px}
.btn .dot{width:26px;height:26px;border-radius:50%;background:#c3d0c9;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.btn .dot.done{background:var(--teal)}
.steps{margin:10px 0;padding:0;list-style:none;counter-reset:s}
.steps li{padding:9px 0 9px 38px;position:relative;font-size:15px;line-height:1.35}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--txt);display:grid;place-items:center;font-weight:600;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--paper2);border-radius:14px;padding:10px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;opacity:.7}
.bar{height:12px;background:var(--paper2);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar i.amber{background:var(--amber)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid #cdd9d2;text-align:left}
.tbl th{font-weight:600;opacity:.65;font-size:12.5px}
.badge{display:inline-block;background:var(--ink);color:var(--amber);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.badge.off{background:var(--paper2);color:#8a9c95}
.insight{background:#fff7dc;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14.5px;line-height:1.4}
.qtext{font-size:19px;font-weight:600;line-height:1.3;margin:10px 0 12px}
.prog{font-size:13px;opacity:.65}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #cdd9d2;font-size:15.5px}
.toggle button{width:52px;height:30px;border-radius:15px;background:#b7c6be;position:relative}
.toggle button::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle button.on{background:var(--teal)}
.toggle button.on::after{left:25px}
body.vr #sheet,body.vr #shade{display:none!important}
#vrwrap{position:fixed;inset:0;z-index:40;display:none;background:#0b1a22}
#vrwrap canvas{display:block;width:100%;height:100%;touch-action:none}
#vrExit{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;background:#D63A5A;color:#fff;font-weight:700;border-radius:12px;padding:10px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="iconbtn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="brand">Circuit Quest<small id="modeTag"></small></div>
    <button class="iconbtn" id="btnVR" aria-label="View in VR" style="font-weight:800;font-size:13px;color:#F4B41A">VR</button>
    <div id="score"><b id="sc_pts">0</b> pts &nbsp;Lv <span id="sc_lv">1</span></div>
  </header>
  <div id="goal"><div class="t"><b id="goalTitle"></b><span id="goalText"></span></div><button id="btnHint">Hint</button></div>
  <div id="sceneWrap"><canvas id="scn"></canvas></div>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="chip"></div>
    <div id="toast"></div>
    <div id="rail">
      <button id="tSelect" class="on" aria-label="Select and move"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button>
      <button id="tWire" aria-label="Draw wire"><svg viewBox="0 0 24 24"><path d="M4 18h6V8h10"/><circle cx="4" cy="18" r="1.5"/><circle cx="20" cy="8" r="1.5"/></svg></button>
      <button id="tErase" aria-label="Erase"><svg viewBox="0 0 24 24"><path d="M5 17l9-11 6 5-7 8H8z"/><path d="M8 19h12"/></svg></button>
      <button id="tRotate" aria-label="Rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg></button>
      <button id="tUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12" transform="translate(0 -5)"/></svg></button>
      <button id="tFit" aria-label="Fit to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <section id="insp"></section>
  </main>
  <section id="scope">
    <div id="scbar"><button id="pCH1" class="ch1">CH1 probe</button><button id="pCH2" class="ch2">CH2 probe</button><button id="pI" class="chi">Current</button><button id="pClr">Clear</button><span class="sp"></span><button id="bRun" aria-label="Pause or run">Pause</button><button id="bSpeed">Speed 1x</button><button id="bWm">−</button><button id="bWp">+</button></div>
    <div id="scview"><canvas id="sc"></canvas><div id="scinfo"><span id="scV" style="color:#4FE0E8"></span><span id="scV2" style="color:#8BE28B"></span><span id="scI" style="color:#F4B41A"></span></div></div>
  </section>
  <nav id="palette" aria-label="Parts"></nav>
</div>
<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<script>
/* ---------- Circuit engine: Modified Nodal Analysis, trapezoidal/BE companions, Newton-Raphson ---------- */
(function (root) {
  const VT = 0.025852, GMIN = 1e-12;

  function pnjlim(vnew, vold, vt, vcrit) {
    let lim = false;
    if (vnew > vcrit && Math.abs(vnew - vold) > 2 * vt) {
      if (vold > 0) {
        const arg = 1 + (vnew - vold) / vt;
        vnew = arg > 0 ? vold + vt * Math.log(arg) : vcrit;
      } else {
        vnew = vt * Math.log(vnew / vt);
      }
      lim = true;
    }
    return [vnew, lim];
  }

  function solve(A, b, n, x) {
    for (let c = 0; c < n; c++) {
      let piv = c, max = Math.abs(A[c * n + c]);
      for (let r = c + 1; r < n; r++) { const v = Math.abs(A[r * n + c]); if (v > max) { max = v; piv = r; } }
      if (!(max > 1e-300)) return false;
      if (piv !== c) {
        for (let k = c; k < n; k++) { const t = A[c * n + k]; A[c * n + k] = A[piv * n + k]; A[piv * n + k] = t; }
        const tb = b[c]; b[c] = b[piv]; b[piv] = tb;
      }
      const d = A[c * n + c];
      for (let r = c + 1; r < n; r++) {
        const f = A[r * n + c] / d;
        if (f !== 0) { for (let k = c; k < n; k++) A[r * n + k] -= f * A[c * n + k]; b[r] -= f * b[c]; }
      }
    }
    for (let r = n - 1; r >= 0; r--) {
      let s = b[r];
      for (let k = r + 1; k < n; k++) s -= A[r * n + k] * x[k];
      x[r] = s / A[r * n + r];
    }
    return true;
  }

  const STATE = ['v', 'i', 'vprev', 'iprev', 'vl', 'vl2', 'ib', 'ic', 'vmin', 'vmax', 'vsrc'];

  function Sim() {
    this.elems = []; this.N = 0; this.t = 0; this.error = null;
    this.nodeV = new Float64Array(0); this.dt = 1e-4; this.beLeft = 3;
    this.onStep = null;
  }

  Sim.prototype.load = function (nl, keep) {
    const old = new Map();
    if (keep) for (const e of this.elems) old.set(e.id, e);
    const oldN = this.N, oldV = this.nodeV;
    this.N = nl.N;
    this.elems = nl.elems.map(src => {
      const e = Object.assign({ v: 0, i: 0, vprev: 0, iprev: 0, vl: 0, vl2: 0, ib: 0, ic: 0, vmin: Infinity, vmax: -Infinity, vsrc: 0, g: 0, ieq: 0 }, src);
      const o = old.get(e.id);
      if (o && o.type === e.type) for (const k of STATE) e[k] = o[k];
      if (e.type === 'D') {
        e.vtd = (e.nn || 1) * VT;
        e.vcrit = e.vtd * Math.log(e.vtd / (Math.SQRT2 * e.is));
      } else if (e.type === 'Q') {
        e.vcrit = VT * Math.log(VT / (Math.SQRT2 * e.is));
      }
      return e;
    });
    this.A = new Float64Array(this.N * this.N);
    this.b = new Float64Array(this.N);
    this.x = new Float64Array(this.N);
    this.nonlinear = this.elems.some(e => e.type === 'D' || e.type === 'Q');
    if (keep && oldN === this.N) this.nodeV = oldV; else this.nodeV = new Float64Array(this.N);
    if (!keep) { this.t = 0; this.beLeft = 3; this.error = null; }
    this.dt = this.suggestDt();
  };

  Sim.prototype.suggestDt = function () {
    let minR = Infinity, maxR = 0, minC = Infinity, minL = Infinity, tcs = [];
    for (const e of this.elems) {
      if (e.type === 'R') { minR = Math.min(minR, e.val); maxR = Math.max(maxR, e.val); }
      if (e.type === 'C') minC = Math.min(minC, e.val);
      if (e.type === 'L') minL = Math.min(minL, e.val);
      if (e.type === 'V' && (e.ac || (e.step && e.freq > 0))) tcs.push(1 / (e.freq * 100));
    }
    if (!isFinite(minR)) minR = 1000;
    if (maxR === 0) maxR = 1000;
    for (const e of this.elems) {
      if (e.type === 'C') tcs.push(e.val * minR / 3);
      if (e.type === 'L') tcs.push(e.val / maxR / 3);
    }
    if (isFinite(minC) && isFinite(minL)) tcs.push(Math.sqrt(minL * minC) / 12);
    let dt = 5e-4;
    for (const t of tcs) dt = Math.min(dt, t);
    return Math.max(2e-7, Math.min(5e-4, dt));
  };

  Sim.prototype.requestBE = function () { this.beLeft = 3; };

  Sim.prototype.step = function (dt) {
    const N = this.N, A = this.A, b = this.b, x = this.x, el = this.elems;
    const tn = this.t + dt;
    for (const e of el) {
      if (e.type !== 'V' || e.dead) continue;
      let vs;
      if (e.ac) vs = e.amp * Math.sin(2 * Math.PI * e.freq * tn);
      else if (e.step) vs = e.freq > 0 ? (((tn * e.freq) % 1) < 0.5 ? e.vs : 0) : (tn >= 0.2 ? e.vs : 0);
      else vs = e.vs;
      if (e.step && Math.abs(vs - e.vsrc) > 1e-9 && this.t > 0) this.beLeft = Math.max(this.beLeft, 2);
      e.vsrc = vs;
    }
    const th = this.beLeft > 0 ? 1 : 0.5;
    if (this.beLeft > 0) this.beLeft--;
    for (const e of el) {
      if (e.dead) continue;
      if (e.type === 'C') { e.g = e.val / (th * dt); e.ieq = -e.g * e.vprev - ((1 - th) / th) * e.iprev; }
      else if (e.type === 'L') { e.g = th * dt / e.val; e.ieq = e.iprev + (1 - th) * dt / e.val * e.vprev; }
    }
    const V = n => (n < 0 ? 0 : x[n]);
    const maxIt = this.nonlinear ? 100 : 1;
    let okSolve = true;
    for (let it = 0; it < maxIt; it++) {
      A.fill(0); b.fill(0);
      for (let k = 0; k < N; k++) A[k * N + k] = GMIN;
      const addG = (i, j, g) => {
        if (i >= 0) A[i * N + i] += g;
        if (j >= 0) A[j * N + j] += g;
        if (i >= 0 && j >= 0) { A[i * N + j] -= g; A[j * N + i] -= g; }
      };
      const addI = (i, j, I) => { if (i >= 0) b[i] -= I; if (j >= 0) b[j] += I; };
      const addRow = (k, terms, konst) => {
        if (k < 0) return;
        for (let q = 0; q < terms.length; q += 2) { const m = terms[q]; if (m >= 0) A[k * N + m] += terms[q + 1]; }
        b[k] -= konst;
      };
      for (const e of el) {
        if (e.dead) continue;
        const n = e.n;
        switch (e.type) {
          case 'R': addG(n[0], n[1], 1 / e.val); break;
          case 'SW': addG(n[0], n[1], e.closed ? 100 : 1e-9); break;
          case 'C': case 'L': addG(n[0], n[1], e.g); addI(n[0], n[1], e.ieq); break;
          case 'V': addG(n[0], n[1], 1 / e.rint); addI(n[0], n[1], -e.vsrc / e.rint); break;
          case 'D': {
            const ev = Math.exp(Math.min(e.vl / e.vtd, 110));
            const id = e.is * (ev - 1), g = e.is / e.vtd * ev;
            addG(n[0], n[1], g + GMIN); addI(n[0], n[1], id - g * e.vl);
            break;
          }
          case 'Q': { // n = [B, C, E]
            const eb = Math.exp(Math.min(e.vl / VT, 110)), ec = Math.exp(Math.min(e.vl2 / VT, 110));
            const gbe = e.is / VT * eb, gbc = e.is / VT * ec;
            const a = gbe, b2 = -gbc - gbc / e.br, c = gbe / e.beta, d = gbc / e.br;
            const Ic0 = e.is * (eb - ec) - e.is / e.br * (ec - 1);

    if (a > 2e-7) c.ph += Math.sign(e.i) * (0.5 + 2.5 * (1 - Math.exp(-a / 0.015))) * dt;
